<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travelodge Inspection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--navy:#0b1f3a;--blue:#1c3d6b;--bg:#eef2f7;--green:#2ecc71;--red:#e74c3c;}
body{margin:0;font-family:sans-serif;background:var(--bg);} 
header{background:var(--navy);color:#fff;padding:12px;text-align:center;font-size:18px;position:sticky;top:0;}
.container{padding:12px;max-width:900px;margin:auto;}
.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;box-shadow:0 3px 8px rgba(0,0,0,0.08);} 
input,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #ccc;margin:6px 0;font-size:14px;}
textarea{resize:none;min-height:60px;}
button{background:var(--blue);color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer;margin-top:6px;width:100%;font-size:14px;}
button.secondary{background:#555;} button.danger{background:var(--red);} 
.hidden{display:none;}
.switchRow{display:flex;justify-content:space-between;margin:5px 0;}
.switch{position:relative;width:46px;height:24px;} .switch input{display:none;}
.slider{position:absolute;background:#ccc;border-radius:34px;top:0;left:0;right:0;bottom:0;}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked + .slider{background:var(--green);} input:checked + .slider:before{transform:translateX(20px);} 
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.rowBtns{display:flex;gap:6px;}
.rowBtns button{flex:1;}
</style>
</head>
<body>
<header>Travelodge Night Inspection</header>

<div class="container" id="home">
  <div class="card">
    <label>Name</label><input id="name">
    <label>Date</label><input id="date" type="date">
    <button onclick="startInspection()">Start Inspection</button>
  </div>
  <div class="card"><h3>Past Inspections</h3><div id="history"></div></div>
</div>

<div class="container hidden" id="inspection">
  <div class="card">
    <h3 id="sessionTitle"></h3>
    <label>Room</label><input id="room" type="number">

    <div class="switchRow">DND <label class="switch"><input type="checkbox" id="dnd"><span class="slider"></span></label></div>
    <div class="switchRow">Iron <label class="switch"><input type="checkbox" id="iron"><span class="slider"></span></label></div>
    <div class="switchRow">Iron Board <label class="switch"><input type="checkbox" id="ironBoard"><span class="slider"></span></label></div>
    <div class="switchRow">Remote <label class="switch"><input type="checkbox" id="remote"><span class="slider"></span></label></div>
    <div class="switchRow">Phone <label class="switch"><input type="checkbox" id="phone"><span class="slider"></span></label></div>
    <div class="switchRow">Hair Dryer <label class="switch"><input type="checkbox" id="hairDryer"><span class="slider"></span></label></div>
    <div class="switchRow">Shower Curtain <label class="switch"><input type="checkbox" id="showerCurtain"><span class="slider"></span></label></div>
    <div class="switchRow">Clock <label class="switch"><input type="checkbox" id="clock"><span class="slider"></span></label></div>
    <div class="switchRow">AC <label class="switch"><input type="checkbox" id="ac"><span class="slider"></span></label></div>
    <div class="switchRow">Fridge <label class="switch"><input type="checkbox" id="fridge"><span class="slider"></span></label></div>
    <div class="switchRow">Bathroom Fan <label class="switch"><input type="checkbox" id="bathroomFan"><span class="slider"></span></label></div>
    <div class="switchRow">Toilet <label class="switch"><input type="checkbox" id="toilet"><span class="slider"></span></label></div>

    <div class="grid">
      <input id="pillowCount" placeholder="Pillows" type="number">
      <input id="bt" placeholder="Bath Towel" type="number">
      <input id="ht" placeholder="Hand Towel" type="number">
      <input id="ft" placeholder="Face Towel" type="number">
      <input id="fm" placeholder="Floor Mat" type="number">
    </div>

    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="saveRoom()">Save Room</button>
    <div class="rowBtns">
      <button onclick="finishInspection()">Finish</button>
      <button class="secondary" onclick="goHome()">Back</button>
    </div>
  </div>
</div>

<div class="container hidden" id="report">
  <div class="card">
    <div class="rowBtns">
      <button onclick="goHome()" class="secondary">Back</button>
      <button onclick="downloadPDF()">PDF</button>
    </div>
    <h3 id="reportTitle"></h3>
    <div id="reportContent"></div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
let currentSession=null;
let editIndex=null;

function startInspection(){
  const name=nameVal(); const date=dateVal();
  currentSession={id:Date.now(),name,date,rooms:[]};
  show('inspection');
  document.getElementById('sessionTitle').innerText=`${name} - ${date}`;
}

function nameVal(){return document.getElementById('name').value}
function dateVal(){return document.getElementById('date').value || new Date().toISOString().split('T')[0]}

function saveRoom(){
  const r={room:room.value,dnd:dnd.checked,iron:iron.checked,ironBoard:ironBoard.checked,remote:remote.checked,phone:phone.checked,hairDryer:hairDryer.checked,showerCurtain:showerCurtain.checked,clock:clock.checked,ac:ac.checked,fridge:fridge.checked,bathroomFan:bathroomFan.checked,toilet:toilet.checked,pillowCount:pillowCount.value,bt:bt.value,ht:ht.value,ft:ft.value,fm:fm.value,notes:notes.value};
  if(editIndex!==null){currentSession.rooms[editIndex]=r; editIndex=null;} else currentSession.rooms.push(r);
  document.querySelectorAll('#inspection input, textarea').forEach(el=>{if(el.type==='checkbox')el.checked=false; else el.value='';});
}

function finishInspection(){
  let all=JSON.parse(localStorage.getItem('inspections')||'[]');
  const index=all.findIndex(x=>x.id===currentSession.id);
  if(index>-1){
    all[index]=currentSession;
  } else {
    all.push(currentSession);
  }
  localStorage.setItem('inspections',JSON.stringify(all));
  loadHistory();
  show('home');
}

function loadHistory(){
  const el=document.getElementById('history'); el.innerHTML='';
  const data=JSON.parse(localStorage.getItem('inspections')||'[]');
  data.forEach(item=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<b>${item.name}</b><br>${item.date}<br>Rooms:${item.rooms.length}
    <div class='rowBtns'>
      <button onclick="openReport(${item.id})">Open</button>
      <button onclick="resume(${item.id})">Resume</button>
      <button onclick="del(${item.id})" class="danger">Delete</button>
    </div>`;
    el.appendChild(div);
  });
}

function getAll(){return JSON.parse(localStorage.getItem('inspections')||'[]')}

function openReport(id){
  const item=getAll().find(x=>x.id===id);
  currentSession=item;
  document.getElementById('reportTitle').innerText=`${item.name} - ${item.date}`;
  const c=document.getElementById('reportContent'); c.innerHTML='';
  item.rooms.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<b>Room ${r.room}</b><br>
    DND:${r.dnd?'✔':'✖'} Iron:${r.iron?'✔':'✖'} IB:${r.ironBoard?'✔':'✖'}<br>
    Remote:${r.remote?'✔':'✖'} Phone:${r.phone?'✔':'✖'} AC:${r.ac?'✔':'✖'} Fridge:${r.fridge?'✔':'✖'}<br>
    Toilet:${r.toilet?'✔':'✖'} HairDryer:${r.hairDryer?'✔':'✖'}<br>
    Pillows:${r.pillowCount} BT:${r.bt} HT:${r.ht} FT:${r.ft} FM:${r.fm}<br>
    Notes:${r.notes||''}
    <button onclick="editRoom(${i})">Edit</button>`;
    c.appendChild(d);
  });
  show('report');
}

function resume(id){
  currentSession=getAll().find(x=>x.id===id);
  show('inspection');
}

function del(id){
  let all=getAll().filter(x=>x.id!==id);
  localStorage.setItem('inspections',JSON.stringify(all));
  loadHistory();
}

function editRoom(i){
  const r=currentSession.rooms[i]; editIndex=i;
  room.value=r.room; dnd.checked=r.dnd; iron.checked=r.iron; ironBoard.checked=r.ironBoard;
  remote.checked=r.remote; phone.checked=r.phone; hairDryer.checked=r.hairDryer;
  showerCurtain.checked=r.showerCurtain; clock.checked=r.clock; ac.checked=r.ac;
  fridge.checked=r.fridge; bathroomFan.checked=r.bathroomFan; toilet.checked=r.toilet;
  pillowCount.value=r.pillowCount; bt.value=r.bt; ht.value=r.ht; ft.value=r.ft; fm.value=r.fm; notes.value=r.notes;
  show('inspection');
}

function downloadPDF(){
  const doc=new jsPDF({orientation:'landscape'});

  doc.setFontSize(14);
  doc.text(`${currentSession.name} - ${currentSession.date}`,148,10,{align:'center'});

  // Passing explicit data objects with content set to spaces so text printing skips them entirely
  const rows=currentSession.rooms.map(r=>[
    r.room,
    { content: ' ', status: r.dnd },
    { content: ' ', status: r.iron },
    { content: ' ', status: r.ironBoard },
    { content: ' ', status: r.remote },
    { content: ' ', status: r.phone },
    { content: ' ', status: r.hairDryer },
    { content: ' ', status: r.showerCurtain },
    { content: ' ', status: r.clock },
    { content: ' ', status: r.ac },
    { content: ' ', status: r.fridge },
    { content: ' ', status: r.bathroomFan },
    { content: ' ', status: r.toilet },
    r.pillowCount, r.bt, r.ht, r.ft, r.fm, r.notes||''
  ]);

  doc.autoTable({
    startY:17,
    margin:{left:5,right:5},
    head:[["Room","DND","Iron","IB","Remote","Phone","HairDryer","ShowerCurtain","Clock","AC","Fridge","Fan","Toilet","Pillows","BT","HT","FT","FloorMat","Notes"]],
    body:rows,
    styles:{fontSize:8},
    columnStyles:{18:{cellWidth:60}},
    
    // Check our custom structural status to draw clean vectors safely
    didDrawCell: function(data) {
      if (data.section === 'body' && data.cell.raw && data.cell.raw.status !== undefined) {
        const isTrue = data.cell.raw.status;
        
        // Calculate the absolute center of the cell
        const centerX = data.cell.x + (data.cell.width / 2);
        const centerY = data.cell.y + (data.cell.height / 2);
        
        doc.setLineWidth(0.5);
        
        if (isTrue) {
          // Draw Green Vector Checkmark
          doc.setDrawColor(46, 204, 113); 
          doc.line(centerX - 2, centerY, centerX - 0.5, centerY + 2);
          doc.line(centerX - 0.5, centerY + 2, centerX + 2.5, centerY - 2.5);
        } else {
          // Draw Red Vector Cross Mark
          doc.setDrawColor(231, 76, 60); 
          doc.line(centerX - 2, centerY - 2, centerX + 2, centerY + 2);
          doc.line(centerX + 2, centerY - 2, centerX - 2, centerY + 2);
        }
      }
    }
  });

  const safeName = (currentSession.name || 'Inspection').replace(/\s+/g, '_');
  const safeDate = currentSession.date || new Date().toISOString().split('T')[0];
  doc.save(`Inspection-${safeName}-${safeDate}.pdf`);
}

function show(id){['home','inspection','report'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function goHome(){show('home');}

loadHistory();
</script>
</body>
</html>
